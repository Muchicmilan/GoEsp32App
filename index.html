<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; }
        .chart-container { flex: 2; min-width: 400px; }
        .sidebar { flex: 1; min-width: 300px; }

        .controls { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 10px 20px; font-size: 14px; cursor: pointer; margin-top: 5px; border: none; border-radius: 4px; }
        input { padding: 8px; width: 70%; margin-bottom: 10px; }
        .on { background-color: #4CAF50; color: white; }
        .off { background-color: #f44336; color: white; }
        .on:hover { background-color: #45a049; }
        .off:hover { background-color: #d32f2f; }

        .stats-box { background-color: #f0f8ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .avg-temp { font-size: 24px; font-weight: bold; color: #333; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; color: #333; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

<h1>Temperatura Sobe</h1>

<div class="container">
    <div class="chart-container">
        <canvas id="tempChart"></canvas>
    </div>

    <div class="sidebar">

        <div class="stats-box">
            <div>Prosečna temperatura (zadnjih 50)</div>
            <div class="avg-temp"><span id="avgTempVal">--</span> °C</div>
        </div>

        <!-- Tabela -->
        <h3>Poslednjih 10 merenja</h3>
        <table id="readingsTable">
            <thead>
            <tr>
                <th>Vreme</th>
                <th>MAC</th>
                <th>Temp (°C)</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <div class="controls">
            <h3>Kontrola LED-a</h3>
            <input type="text" id="macAddr" placeholder="Unesi MAC adresu" value="TVOJ_MAC_OVDE">
            <br>
            <button class="on" onclick="toggleLed('1')">Uključi LED</button>
            <button class="off" onclick="toggleLed('0')">Isključi LED</button>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('tempChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Temperatura (°C)',
                data: [],
                borderColor: 'rgb(75, 192, 192)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: false }
            }
        }
    });

    async function loadData() {
        try {
            const response = await fetch('/api/readings');
            const data = await response.json();

            if (!data || data.length === 0) {
                console.log("Nema podataka u bazi");
                return;
            }

            const sum = data.reduce((acc, curr) => acc + curr.temperature, 0);
            const avg = sum / data.length;
            document.getElementById('avgTempVal').innerText = avg.toFixed(2);

            const tableBody = document.querySelector('#readingsTable tbody');
            tableBody.innerHTML = ''; // Ocisti staru tabelu

            const top10 = data.slice(0, 10);

            top10.forEach(row => {
                const tr = document.createElement('tr');
                const dateObj = new Date(row.time);
                const timeStr = dateObj.toLocaleTimeString();

                tr.innerHTML = `
                    <td>${timeStr}</td>
                    <td>${row.mac}</td>
                    <td>${row.temperature.toFixed(1)}</td>
                `;
                tableBody.appendChild(tr);
            });

            const chartData = [...data].reverse();

            chart.data.labels = chartData.map(d => new Date(d.time).toLocaleTimeString());
            chart.data.datasets[0].data = chartData.map(d => d.temperature);
            chart.update();

        } catch (error) {
            console.error("Greska pri ucitavanju podatka", error)
        }
    }

    async function toggleLed(state) {
        const mac = document.getElementById('macAddr').value;
        if(!mac) { alert("Unesite MAC adresu!"); return; }

        try {
            await fetch('/api/set', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ mac: mac, state: state })
            });
        } catch (e) {
            console.error("Greska pri slanju komande", e);
        }
    }

    setInterval(loadData, 5000);
    loadData();
</script>
</body>
</html>
